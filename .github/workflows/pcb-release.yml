# Reusable KiCad release pipeline: KiBot ERC/DRC, then publish to GitHub Releases and Google Drive.
# Board repos call it from a thin workflow (see README.md); every github.*, vars.* and secret
# below belongs to the calling board repo.
#   vX.Y      design release: committed project tree, schematic/PCB PDFs, BOM, iBOM, STEP, diffs.
#             ERC/DRC errors only warn. Without a .kicad_pcb it builds the schematic outputs only.
#   vX.Y-fab  fabrication release: gerbers, drill, fab zip, pick-and-place, BOM. Must point at
#             the same commit as vX.Y; ERC/DRC errors stop it. Drive: <folder>/<repo>/vX.Y/ for
#             the design release, flat <folder>/<repo>/vX.Y/Gerbers/ for the fab files.
# Drive upload runs when GDRIVE_FOLDER_ID or GDRIVE_TEAM_DRIVE_ID is set, with one credential:
#   secret   GDRIVE_TOKEN          rclone OAuth token JSON; any folder you can edit (wins if both set)
#   secret   GDRIVE_SA_JSON        service-account JSON key; shared drives only
#   variable GDRIVE_TEAM_DRIVE_ID  shared drive ID (service-account mode)
#   variable GDRIVE_FOLDER_ID      target folder ID (empty = shared drive root)

name: PCB release

on:
  workflow_call:
    inputs:
      fab:
        description: Build the fabrication outputs instead of the design release
        type: boolean
        default: false

env:
  OUT_DIR: output
  PIPELINE_DIR: .kicad-release

jobs:
  release:
    runs-on: ubuntu-latest
    # One run per board repo at a time: parallel rclone runs can create duplicate same-name
    # Drive folders.
    concurrency:
      group: pcb-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff outputs need history and tags

      # This pipeline's own files (the default KiBot config), at the exact revision being run.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.PIPELINE_DIR }}
          sparse-checkout: kibot

      - name: Resolve release
        id: rel
        run: |
          echo "$PIPELINE_DIR/" >> .git/info/exclude  # keep KiBot's git diffs blind to it
          shopt -s nullglob
          PROS=(*.kicad_pro)
          if (( ${#PROS[@]} != 1 )); then
            echo "::error::Expected exactly one .kicad_pro at the repo root, found ${#PROS[@]}"
            exit 1
          fi
          PROJECT="${PROS[0]%.kicad_pro}"
          # A board repo may override the default KiBot config; it must keep the design/fab groups.
          CONFIG=.kibot.yaml
          [ -f "$CONFIG" ] || CONFIG="$PIPELINE_DIR/kibot/default.kibot.yaml"
          NAME="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF_NAME" == *-fab || "${{ inputs.fab }}" == true ]]; then
            KIND=fab
          else
            KIND=design
          fi
          VERSION="${NAME%-fab}"
          # Gerbers ship only for a commit that already carries the matching design tag.
          if [[ "$KIND" == fab && "$GITHUB_EVENT_NAME" == push ]] &&
             [[ "$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::$GITHUB_REF_NAME must point at the same commit as tag $VERSION"
            exit 1
          fi
          TARGETS=$KIND SKIP=__NONE__ BOARD="$PROJECT.kicad_pcb" DONT_STOP=false
          if [[ ! -f "$BOARD" ]]; then
            if [[ "$KIND" == fab ]]; then
              echo "::error::A fab release needs $BOARD"
              exit 1
            fi
            # Schematic-only board: no DRC, zone fill or PCB outputs yet.
            echo "::warning::No $BOARD yet, building the schematic-only design release"
            TARGETS=design_sch SKIP=drc,check_zone_fills BOARD=__SCAN__
          fi
          # ERC/DRC errors only warn on design releases; they stop vX.Y-fab.
          if [[ "$KIND" == design ]]; then
            DONT_STOP=true
          fi
          # Diff base: previous design tag, or the root commit on the first release.
          BASE=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-fab' HEAD^ 2>/dev/null \
                 || git rev-list --max-parents=0 HEAD | tail -n1)
          {
            echo "project=$PROJECT"
            echo "config=$CONFIG"
            echo "kind=$KIND"
            echo "targets=$TARGETS"
            echo "skip=$SKIP"
            echo "board=$BOARD"
            echo "dont_stop=$DONT_STOP"
            echo "version=$VERSION"
            echo "name=${{ github.event.repository.name }}_$NAME"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "Building $KIND for $PROJECT with $CONFIG"
          # KiBot runs as root in a container; let its git read the runner-owned checkout.
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" --add safe.directory '*'

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k10_1_9_0
        with:
          config: ${{ steps.rel.outputs.config }}
          schema: ${{ steps.rel.outputs.project }}.kicad_sch
          board: ${{ steps.rel.outputs.board }}
          dir: ${{ env.OUT_DIR }}
          skip: ${{ steps.rel.outputs.skip }}
          # The target group goes last, not in `targets`: the action puts targets before
          # additional_args, and KiBot reads every word after the first target as another target.
          additional_args: >-
            -E DIFF_REF=${{ steps.rel.outputs.base }}
            -E XRC_DONT_STOP=${{ steps.rel.outputs.dont_stop }}
            ${{ steps.rel.outputs.targets }}

      # Surface ERC/DRC results as annotations: warnings on design releases, errors on fab.
      - name: Report ERC/DRC
        if: ${{ !cancelled() && steps.rel.outcome == 'success' }}
        run: |
          python3 - "${{ steps.rel.outputs.kind }}" <<'PY'
          import collections, glob, json, os, sys

          level = "warning" if sys.argv[1] == "design" else "error"

          def count(node, counts):
              if isinstance(node, dict):
                  if "type" in node and "items" in node and not node.get("excluded"):
                      counts[node.get("severity", "error")] += 1
                  for value in node.values():
                      count(value, counts)
              elif isinstance(node, list):
                  for value in node:
                      count(value, counts)

          rows = []
          for check in ("ERC", "DRC"):
              reports = glob.glob(f"{os.environ['OUT_DIR']}/checks/*-{check.lower()}*.json")
              if not reports:
                  continue
              counts = collections.Counter()
              with open(reports[0]) as report:
                  count(json.load(report), counts)
              rows.append(f"| {check} | {counts['error']} | {counts['warning']} |\n")
              if counts["error"]:
                  print(f"::{level} title={check}::{counts['error']} errors, {counts['warning']} warnings,"
                        " see the ERC/DRC reports in the outputs")
          if rows:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("| Check | Errors | Warnings |\n|---|---|---|\n" + "".join(rows))
          PY

      - name: Package outputs
        run: |
          mkdir -p dist source
          zip -qr "dist/${{ steps.rel.outputs.name }}.zip" "$OUT_DIR"
          # The committed project tree at this ref, for Drive. .gitignore keeps .kicad-auto/, ERC/DRC
          # reports and backups out. GitHub Releases attach their own source archives.
          git archive HEAD | tar -x -C source

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rel.outputs.name }}
          path: dist/

      - name: Upload to Google Drive
        if: vars.GDRIVE_FOLDER_ID != '' || vars.GDRIVE_TEAM_DRIVE_ID != ''
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_TEAM_DRIVE_ID: ${{ vars.GDRIVE_TEAM_DRIVE_ID }}
        run: |
          # A service account has no storage quota, so it can only write into shared drives;
          # a user token uploads as you into any folder you can edit, "Shared with me" included.
          if [ -n "$GDRIVE_TOKEN" ]; then
            export RCLONE_CONFIG_GDRIVE_TOKEN="$GDRIVE_TOKEN"
          elif [ -n "$GDRIVE_SA_JSON" ] && [ -n "$GDRIVE_TEAM_DRIVE_ID" ]; then
            export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS="$GDRIVE_SA_JSON"
            export RCLONE_CONFIG_GDRIVE_TEAM_DRIVE="$GDRIVE_TEAM_DRIVE_ID"
          else
            echo "::error::Drive upload needs secret GDRIVE_TOKEN, or GDRIVE_SA_JSON with variable GDRIVE_TEAM_DRIVE_ID"
            exit 1
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          DEST="gdrive:${{ github.event.repository.name }}/${{ steps.rel.outputs.version }}"
          # Outputs land flat: design files directly in vX.Y/, fab files in vX.Y/Gerbers/.
          DUPES=$(find "$OUT_DIR" -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Outputs share file names, cannot flatten: $DUPES"
            exit 1
          fi
          mkdir -p flat && find "$OUT_DIR" -type f -exec cp {} flat/ \;
          if [[ "${{ steps.rel.outputs.kind }}" == fab ]]; then
            DEST="$DEST/Gerbers"
          fi
          rclone copy dist "$DEST"  # outputs zip
          rclone copy flat "$DEST"
          if [[ "${{ steps.rel.outputs.kind }}" == design ]]; then
            rclone copy source "$DEST/source"  # KiCad project as committed
          fi
          echo "Uploaded to $DEST"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: ${{ steps.rel.outputs.kind == 'design' }}  # "latest" stays the design release
