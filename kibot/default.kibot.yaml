# Default KiBot release config (KiCad 10), used when a board repo has no root .kibot.yaml.
# An override must keep the `design`, `design_sch` and `fab` groups and the definitions below.
# Reference: https://kibot.readthedocs.io
# Run locally from a board repo: kibot -c <this file> -d output        (everything)
#                                kibot -c <this file> -d output fab    (one group)
# DIFF_REF is the git ref the diff outputs compare against; CI passes the previous release tag.
# XRC_DONT_STOP=true turns ERC/DRC errors into warnings; CI sets it for design releases only.
definitions:
  DIFF_REF: HEAD
  XRC_DONT_STOP: false
...
kibot:
  version: 1

# ERC/DRC reports land in output/checks/ whether or not the run stops.
preflight:
  erc:
    dont_stop: @XRC_DONT_STOP@
    format: [HTML, JSON]
    dir: checks
  drc:                    # also checks schematic/PCB parity
    dont_stop: @XRC_DONT_STOP@
    format: [HTML, JSON]
    dir: checks
  check_zone_fills: true  # refill zones before plotting

filters:
  # iBOM with a filter writes a netlist, and KiBot crashes there on footprints that exist only on
  # the PCB (board-only, e.g. Allegro drawing symbols): they get no parent sheet. Treating parts
  # excluded from the BOM as not fitted keeps them out of that netlist.
  - name: ibom_skip_not_in_bom
    comment: Parts excluded from the BOM count as not fitted
    type: generic
    exclude_not_in_bom: true

outputs:
  # ---------- Fabrication ----------
  - name: gerbers
    comment: Gerber files
    type: gerber
    dir: fab/gerbers
    layers: [copper, F.SilkS, B.SilkS, F.Mask, B.Mask, F.Paste, B.Paste, Edge.Cuts]

  - name: drill
    comment: Excellon drill files
    type: excellon
    dir: fab/gerbers
    options:
      pth_and_npth_single_file: false

  - name: fab_zip
    comment: Gerbers + drill in one zip for the fab house
    type: compress
    dir: fab
    options:
      output: '%f-gerbers.%x'
      files:
        - from_output: gerbers
          dest: /
        - from_output: drill
          dest: /

  # ---------- Assembly ----------
  - name: bom
    comment: Bill of materials
    type: bom
    dir: assembly
    options:
      format: CSV
      # Purchasing columns only. kicad-auto layout fields and per-part notes such as Purpose
      # would otherwise become columns and clash inside grouped rows. A field a board lacks
      # stays an empty column with a KiBot warning.
      columns: [Row, References, Value, Footprint, Quantity Per PCB, Description, Manufacturer,
                MPN, Datasheet]

  # KiBot applies KiCad's DNP flag only to outputs that run a filter. The BOM runs this one by
  # default; position and ibom have none, so without it they list DNP parts as fitted.
  - name: position
    comment: Pick-and-place file
    type: position
    dir: assembly
    options:
      format: CSV
      separate_files_for_front_and_back: false
      dnf_filter: _kibom_dnf_Config

  - name: ibom
    comment: Interactive HTML BOM
    type: ibom
    dir: assembly
    options:
      dnf_filter: [_kibom_dnf_Config, ibom_skip_not_in_bom]

  # ---------- Documentation ----------
  - name: schematic_pdf
    comment: Schematic PDF
    type: pdf_sch_print
    dir: docs

  - name: pcb_pdf
    comment: One page per copper layer plus top/bottom assembly
    type: pcb_print
    dir: docs
    options:
      format: PDF
      force_edge_cuts: true
      pages:
        - layers: [F.Cu]
          sheet: '%ll'
          repeat_for_layer: F.Cu
          repeat_layers: copper
        - layers: [F.Fab, F.SilkS]
          sheet: Assembly top
        - layers: [B.Fab, B.SilkS]
          sheet: Assembly bottom
          mirror: true

  - name: step
    comment: 3D model
    type: step
    dir: 3d

  # ---------- Change review ----------
  - name: diff_sch
    comment: Schematic diff against DIFF_REF
    type: diff
    dir: diff
    options:
      old: '@DIFF_REF@'
      old_type: git
      new_type: current
      pcb: false
      # %sf: diff outputs expand %f from the PCB, which a schematic-only board doesn't have yet.
      output: '%sf-%i%I%v.%x'

  - name: diff_pcb
    comment: PCB diff against DIFF_REF
    type: diff
    dir: diff
    options:
      old: '@DIFF_REF@'
      old_type: git
      new_type: current
      pcb: true

# CI builds one group per tag: vX.Y -> design (design_sch while the board has no .kicad_pcb),
# vX.Y-fab -> fab. BOM is in both so the fab zip alone is enough to order assembly.
groups:
  - name: design_sch
    outputs: [bom, schematic_pdf, diff_sch]
  - name: design
    outputs: [design_sch, ibom, pcb_pdf, step, diff_pcb]
  - name: fab
    outputs: [gerbers, drill, fab_zip, position, bom]
